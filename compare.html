<!DOCTYPE html>
<!-- compare.html — compare two lists. Markup only; logic in js/compare/main.js. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="cmp.title">Сравнение списков</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=492">
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand-row">
      <span class="brand"><span class="lock">🔒</span><span data-i18n="cmp.title"></span></span>
      <div class="lang-sw" id="langSw" role="group"></div>
    </div>
    <div class="top-actions">
      <button class="btn ghost icon-btn" id="themeBtn" data-i18n-title="hdr.theme">◑</button>
      <a class="btn ghost" id="backLink" href="index.html" data-i18n="cmp.back"></a>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="intro">
    <h1 data-i18n="cmp.h1"></h1>
    <p data-i18n-html="cmp.intro_html"></p>
  </section>

  <div class="cmp-inputs">
    <div class="cmp-col">
      <input class="cmp-name" id="nameA" data-i18n-ph="cmp.nameA" autocomplete="off">
      <label><span data-i18n="cmp.codeA"></span> <button class="btn ghost mini" id="fillMine" type="button" style="float:right;margin-top:-4px" data-i18n="cmp.fillMine"></button></label>
      <textarea id="codeA" data-i18n-ph="cmp.codePh"></textarea>
    </div>
    <div class="cmp-col">
      <input class="cmp-name" id="nameB" data-i18n-ph="cmp.nameB" autocomplete="off">
      <label data-i18n="cmp.codeB"></label>
      <textarea id="codeB" data-i18n-ph="cmp.codePh"></textarea>
    </div>
  </div>

  <button class="btn primary" id="cmpBtn" style="width:100%;padding:12px" data-i18n="cmp.go"></button>

  <div class="search cmp-search" id="cmpSearchBox" hidden>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="search" id="cmpSearch" data-i18n-ph="search.ph" autocomplete="off">
  </div>

  <div id="results"></div>

  <footer class="foot" data-i18n="cmp.foot"></footer>
</main>

<div class="toast" id="toast"></div>

<script src="js/boot.js?v=492" data-page="compare" data-v="492"></script>
</body>
</html>
